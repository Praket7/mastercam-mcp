name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - name: Verify generated capability docs
        run: |
          pnpm run docs:capabilities
          git diff --exit-code -- docs/CAPABILITIES.md

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Test framed mock bridge
        env:
          MASTERCAM_MCP_PIPE: /tmp/mastercam-mcp-smoke.sock
        run: |
          set -euo pipefail
          timeout 15 node dist/mock-backend.js &
          backend_pid=$!
          trap 'kill $backend_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            [ -S "$MASTERCAM_MCP_PIPE" ] && break
            sleep 0.1
          done
          node <<'NODE'
          const net = require('node:net');
          const path = process.env.MASTERCAM_MCP_PIPE;
          const payload = Buffer.from(JSON.stringify({
            type: 'request',
            protocolVersion: 2,
            requestId: 'smoke-1',
            tool: 'mastercam_status',
            arguments: {}
          }), 'utf8');
          const frame = Buffer.alloc(8 + payload.length);
          frame.writeBigUInt64LE(BigInt(payload.length), 0);
          payload.copy(frame, 8);

          const socket = net.createConnection(path);
          let buffer = Buffer.alloc(0);
          const fail = message => { console.error(message); socket.destroy(); process.exit(1); };
          const timer = setTimeout(() => fail('framed mock smoke timed out'), 5000);

          socket.on('connect', () => socket.write(frame));
          socket.on('data', chunk => {
            buffer = Buffer.concat([buffer, chunk]);
            if (buffer.length < 8) return;
            const len = Number(buffer.readBigUInt64LE(0));
            if (buffer.length < 8 + len) return;
            const response = JSON.parse(buffer.subarray(8, 8 + len).toString('utf8'));
            clearTimeout(timer);
            if (!response.ok || response.requestId !== 'smoke-1') fail(JSON.stringify(response));
            console.log('Framed response:', JSON.stringify(response));
            socket.end();
          });
          socket.on('error', error => fail(error.message));
          socket.on('close', () => process.exit(0));
          NODE
      - name: Test MCP stdio 2026-07-28
        env:
          MASTERCAM_MCP_BACKEND: mock
        run: pnpm run smoke
      - name: Test HTTP server 2026-07-28
        env:
          MASTERCAM_MCP_BACKEND: mock
        run: pnpm run smoke:http

  package-test:
    name: Package Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack
      - name: Install package in temp dir
        run: |
          set -euo pipefail
          archive=$(ls -1 mastercam-mcp-*.tgz | head -n 1)
          test -n "$archive"
          mkdir /tmp/test-install
          cd /tmp/test-install
          npm install "${{ github.workspace }}/$archive"
          npx mastercam-mcp version
          MASTERCAM_MCP_BACKEND=mock npx mastercam-mcp doctor
          npx mastercam-mcp acceptance --mock

  windows-build:
    name: Windows Build
    runs-on: windows-latest
    timeout-minutes: 25
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Build portable native projects
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build native/MastercamMcp.Protocol/MastercamMcp.Protocol.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/MastercamMcp.Adapter.Abstractions/MastercamMcp.Adapter.Abstractions.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/MastercamMcp.Core/MastercamMcp.Core.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build native/MastercamMcp.ApiCatalog/MastercamMcp.ApiCatalog.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test native/MastercamMcp.Protocol.Tests/MastercamMcp.Protocol.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run Windows tests
        run: pnpm run test

  macos-build:
    name: macOS Build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript, csharp
          queries: security-extended
      - name: Build portable C# for CodeQL
        run: |
          set -euo pipefail
          dotnet build native/MastercamMcp.Protocol/MastercamMcp.Protocol.csproj -c Release
          dotnet build native/MastercamMcp.Adapter.Abstractions/MastercamMcp.Adapter.Abstractions.csproj -c Release
          dotnet build native/MastercamMcp.Core/MastercamMcp.Core.csproj -c Release
          dotnet build native/MastercamMcp.ApiCatalog/MastercamMcp.ApiCatalog.csproj -c Release
          dotnet test native/MastercamMcp.Protocol.Tests/MastercamMcp.Protocol.Tests.csproj -c Release
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
      - name: Secret Scan - gitleaks
        if: always()
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Secret Scan - TruffleHog
        if: always()
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.before || 'HEAD~1' }}
          head: HEAD
          extra_args: --debug --only-verified

  dependency-review:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit production dependencies for high-severity vulnerabilities
        run: pnpm audit --prod --audit-level=high
